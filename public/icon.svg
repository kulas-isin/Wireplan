<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Wireplan">
  <rect width="1024" height="1024" fill="#0F3D2E"/>
  <!-- 線框頁面外框 -->
  <g stroke="#FFFFFF" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="240" y="220" width="440" height="560" rx="56"/>
  </g>
  <!-- 頁面內容（較細，維持層次） -->
  <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="332" y1="348" x2="588" y2="348"/>
    <rect x="332" y="440" width="170" height="126" rx="20"/>
    <line x1="332" y1="668" x2="470" y2="668"/>
  </g>
  <!-- 鉛筆：45° 壓在頁面右下 -->
  <g transform="translate(650,610) rotate(45)">
    <rect x="-62" y="-300" width="124" height="380" rx="14" fill="#FFFFFF"/>
    <polygon points="-62,80 62,80 0,196" fill="#FFFFFF"/>
    <line x1="-62" y1="-210" x2="62" y2="-210" stroke="#0F3D2E" stroke-width="30"/>
    <polygon points="-16,148 16,148 0,196" fill="#0F3D2E"/>
  </g>
</svg>
